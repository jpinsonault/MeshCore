# Portico manifest for the MeshCore collector cracker web app.
# Lives at http://cracker.localhost/ once the porticod daemon (auto-started at
# logon) discovers this file. See collector/webapp/ and CLAUDE.md.

name = "cracker"

# cwd is the MeshCore repo root (this file is in collector/), so `-m collector.webapp`
# resolves and the GPU-capable venv is used. Portico injects $PORT; the server
# reads it (webapp/server.py --http-port default). Bind loopback only — Portico
# reverse-proxies cracker.localhost to this port.
run = 'collector\.venv\Scripts\python.exe -m collector.webapp --live --host 127.0.0.1'
cwd = ".."

# Live mode: connects to the device at MESHCORE_HOST (repo-root .env, TCP 5005),
# auto-sends `collector start`, and streams every packet into the durable DB
# (~/.config/meshcore-collector/collector.db) while serving the UI + cracker.
# Password comes from MESHCORE_PASSWORD in .env. Drop `--live` for offline
# (serve the DB only), or use `--port COMx` for a USB-attached device.

autostart = true                          # start on daemon boot (= on Windows logon)
network = true                            # expose on the LAN (phone/other devices) via Portico's launcher
idle_stop = "0"                           # never idle-stop: it's an always-on monitor
health = "http://127.0.0.1:{port}/"       # HTTP 200 on the static page = healthy
start_timeout = "30s"
crash_restart = true                      # restart on unexpected exit
