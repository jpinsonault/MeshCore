; Waveshare ESP32-S3-Touch-LCD-1.28 — BLE air mouse with QMI8658C IMU
;
; This board has no LoRa radio. It's a standalone BLE HID mouse using
; the 6-axis IMU (accel + gyro) for sensor-fused pointing.

[env:waveshare_esp32s3_mouse]
platform = platformio/espressif32@6.11.0
framework = arduino
board = esp32-s3-devkitc-1
monitor_speed = 115200
build_flags =
  -w -DNDEBUG
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D PIN_IMU_SDA=6
  -D PIN_IMU_SCL=7
  -D PIN_LCD_BL=2
build_src_filter =
  -<*>
  +<../examples/esp32s3_mouse>
lib_deps =
  Wire
  t-vk/ESP32 BLE Mouse @ ^0.3.1
upload_speed = 921600
